<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- TownCert mark: a village hall (pediment, columns, steps) carrying a certification seal -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <g fill="#ffffff">
    <!-- pediment -->
    <path d="M256 84 L428 196 H84 Z"/>
    <!-- entablature -->
    <rect x="100" y="204" width="312" height="30" rx="4"/>
    <!-- columns -->
    <rect x="118" y="246" width="40" height="124" rx="6"/>
    <rect x="196" y="246" width="40" height="124" rx="6"/>
    <rect x="276" y="246" width="40" height="124" rx="6"/>
    <rect x="354" y="246" width="40" height="124" rx="6"/>
    <!-- steps -->
    <rect x="100" y="382" width="312" height="26" rx="4"/>
    <rect x="84" y="416" width="344" height="24" rx="4"/>
  </g>
  <!-- certification seal, overlapping the lower-right corner -->
  <circle cx="392" cy="388" r="88" fill="#0f172a"/>
  <circle cx="392" cy="388" r="70" fill="#10b981"/>
  <path d="M354 390 L381 417 L432 358" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
